name: Dependabot auto-merge

on:
  pull_request_target:
    branches: ["main"]
    types: [opened, reopened, synchronize, ready_for_review]
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# One backlog processor across event, scheduled, and manual runs. A pending run may
# be replaced; the next hourly sweep rediscovers all remaining PRs.
concurrency:
  group: ${{ github.event_name == 'pull_request_target' && (github.event.pull_request.user.login != 'dependabot[bot]' || github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.draft) && format('dependency-untrusted-{0}', github.run_id) || 'dependency-reconciliation' }}
  cancel-in-progress: false

jobs:
  recover-publication:
    if: github.repository == 'pbuffolino/seeknay-links' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request_target' && github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository && !github.event.pull_request.draft))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      pages: write
    outputs:
      sha: ${{ steps.request.outputs.sha }}
      deadline: ${{ steps.request.outputs.deadline }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Recover checks and publication from an interrupted merge
        id: request
        run: node scripts/dependency-publication.mjs request
        env:
          GH_TOKEN: ${{ github.token }}

  verify-main:
    env:
      DEPENDENCY_DEADLINE: ${{ needs.recover-publication.outputs.deadline }}
    needs: recover-publication
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: read
      deployments: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Require the trusted checkout to match the publication revision
        run: node scripts/dependency-publication.mjs assert-checkout
        env:
          PUBLICATION_SHA: ${{ needs.recover-publication.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # This read-only job is separate from every privileged publisher.
      - run: npm ci --ignore-scripts
      - run: node scripts/dependency-publication.mjs verify
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_SHA: ${{ needs.recover-publication.outputs.sha }}

  discover:
    env:
      DEPENDENCY_DEADLINE: ${{ needs.recover-publication.outputs.deadline }}
    needs: [verify-main, recover-publication]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.prs.outputs.matrix }}
      count: ${{ steps.prs.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
      - id: prs
        run: node scripts/reconcile-dependabot.mjs discover
        env:
          GH_TOKEN: ${{ github.token }}

  reconcile:
    needs: [discover, recover-publication]
    if: needs.discover.outputs.count != '0'
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    permissions:
      contents: write
      pull-requests: write
      actions: write
      security-events: read
      deployments: read
      pages: write
    uses: ./.github/workflows/dependabot-reconcile-pr.yml
    with:
      number: ${{ matrix.number }}
      deadline: ${{ needs.recover-publication.outputs.deadline }}
      allow-rebase: ${{ vars.DEPENDABOT_REBASE_COMMENTS_APPROVED == 'true' }}
