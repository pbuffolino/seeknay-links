name: Update Social Metrics

on:
  schedule:
    # Run daily at 2:17 PM UTC
    - cron: "17 14 * * *"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write
  actions: write
  pages: write

concurrency:
  group: social-metrics-publication
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # Run the Node.js script to fetch new data
      - name: Fetch and persist social metrics
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TIKTOK_SESSION_ID: ${{ secrets.TIKTOK_SESSION_ID }}
          TIKTOK_MS_TOKEN: ${{ secrets.TIKTOK_MS_TOKEN }}
          TIKTOK_USERNAME: ${{ secrets.TIKTOK_USERNAME }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: node scripts/update-social-metrics.mjs

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: assets/social-metrics.json
          commit-message: "chore: update social metrics"
          title: "chore: update social metrics"
          body: "Automated social metrics update."
          branch: "chore/update-social-metrics"
          base: "main"
          delete-branch: true

      # GITHUB_TOKEN changes do not trigger CI or legacy Pages builds automatically.
      - name: Verify and publish metrics PR
        if: steps.cpr.outputs.pull-request-number != ''
        run: node scripts/publish-metrics.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          METRICS_PR: ${{ steps.cpr.outputs.pull-request-number }}
