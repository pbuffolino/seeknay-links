# ⚠️ SECURITY: This workflow uses ${{ secrets.* }} to pass encrypted GitHub Secrets
# as environment variables. Secrets are NEVER exposed in logs or commits.
# Safe to commit publicly.

name: Update Social Metrics

on:
  schedule:
    # Run daily at 2:17 PM UTC
    - cron: "17 14 * * *"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write # Minimal required permission to commit changes
  pull-requests: write # Required to create PRs

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      # Run the Node.js script to fetch new data
      - name: Fetch and persist social metrics
        env:
          # 🔐 The following variables are mapped from GitHub Secrets
          # To update these, go to Settings -> Secrets and variables -> Actions
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TIKTOK_SESSION_ID: ${{ secrets.TIKTOK_SESSION_ID }}
          TIKTOK_MS_TOKEN: ${{ secrets.TIKTOK_MS_TOKEN }}
          TIKTOK_USERNAME: ${{ secrets.TIKTOK_USERNAME }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_USERNAME: ${{ secrets.X_USERNAME }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: node scripts/update-social-metrics.mjs

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # A PAT (not GITHUB_TOKEN) is required so the resulting PR triggers the
          # `pull_request` CI run. PRs opened with GITHUB_TOKEN do not trigger
          # workflows, which would leave the auto-merge permanently blocked by
          # required status checks.
          token: ${{ secrets.METRICS_PAT }}
          commit-message: "chore: update social metrics"
          title: "chore: update social metrics"
          body: "Automated social metrics update."
          branch: "chore/update-social-metrics"
          base: "main"
          delete-branch: true

      - name: Enable Pull Request Automerge
        if: steps.cpr.outputs.pull-request-operation == 'created'
        run: gh pr merge --squash --auto "${{ steps.cpr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
