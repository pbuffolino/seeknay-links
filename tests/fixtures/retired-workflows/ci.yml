name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "23 10 * * *"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --ignore-scripts
      - run: npm test

  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # This profile redirects CI clients to a rate-limited login page. Check it manually.
      - name: Link Checker
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --verbose --no-progress
            --root-dir '${{ github.workspace }}' --index-files index.html
            --remap '^https://links\.seeknay\.com/ file://${{ github.workspace }}/'
            --exclude '(localhost|127\.0\.0\.1):' --exclude 'googletagmanager.com'
            --exclude '^https://www\.instagram\.com/seeknay747/?$'
            './**/*.md' './**/*.html' 'assets/links.json'

  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm audit --audit-level=low

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          license-check: false
          comment-summary-in-pr: never

  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  dependency-metadata-adapter:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: candidate
        run: node scripts/reconcile-dependabot.mjs smoke
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Exercise the pinned metadata action with the isolated context
        if: steps.candidate.outputs.count == '1'
        id: metadata
        continue-on-error: true
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          skip-commit-verification: false
          skip-verification: false
        env:
          NODE_OPTIONS: '--import="${{ github.workspace }}/scripts/dependabot-metadata-context.mjs"'
      - name: Require metadata proof unless the candidate naturally closed or changed
        if: steps.candidate.outputs.count == '1'
        run: node scripts/reconcile-dependabot.mjs smoke-result
        env:
          GH_TOKEN: ${{ github.token }}
          METADATA_OUTCOME: ${{ steps.metadata.outcome }}
          DEPENDABOT_PR: ${{ steps.candidate.outputs.number }}
          DEPENDABOT_SHA: ${{ steps.candidate.outputs.sha }}
          DEPENDABOT_METADATA: ${{ steps.metadata.outputs.updated-dependencies-json }}
